[Sleep]
# Suspend on MBP14,3 does not reliably wake up (see issues/sleep-screen-no-wake.md)
# and can leave the machine fully hung, requiring a hard power-off. Disable all
# sleep states entirely rather than chase individual triggers (GNOME menu, lid
# close, idle timeout) — logind and GNOME both consult these Allow* flags.
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
