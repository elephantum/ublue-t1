[general]
# Ramp fans up earlier than the upstream default (63/66/86) to pull heat
# away from the display/hinge area before it reaches the panel — see
# issues/screen-horizontal-lines.md.
low_temp = 60           # fans stay at minimum speed below this
high_temp = 65          # fan speed ramps up gradually above this
max_temp = 86           # fans run at maximum speed above this
polling_interval = 1
